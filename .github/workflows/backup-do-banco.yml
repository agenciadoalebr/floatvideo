# Backup do banco, fora do Supabase e fora da Vercel.
#
# O Supabase já faz backup próprio. Este aqui existe para outro medo, que
# nenhum backup do próprio fornecedor cobre: perder o acesso à conta.
# Por isso ele roda no GitHub e guarda no Cloudflare R2 — três lugares
# diferentes, três contas diferentes.
#
# São dois artefatos, com finalidades distintas:
#
#   1. db/schema.sql, versionado aqui no repositório. É o que reconstrói
#      as 38 funções, as 29 políticas de RLS e os gatilhos — a regra de
#      negócio do FloatVideo mora no banco, e até agora ela só existia
#      dentro do Supabase. Ficar no git significa poder ler a diferença
#      de uma semana para a outra e enxergar o que mudou no banco.
#
#   2. O despejo completo, com dados, no R2. É o que se restaura.
#
# Para restaurar num Postgres novo:
#   pg_restore --no-owner --no-privileges -d "postgresql://..." arquivo.dump

name: Backup do banco

on:
  schedule:
    # Segunda-feira, 06:00 UTC — 03:00 em Brasília, quando ninguém usa.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      # Só para commitar o db/schema.sql quando ele mudar.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gerar o despejo
        # O pg_dump vem de um contêiner, e não do apt.
        #
        # A versão importa: pg_dump recusa servidor mais novo que ele, e o
        # banco é PostgreSQL 17. Instalar pelo apt exigia acrescentar o
        # repositório do PostgreSQL — que a máquina do GitHub já traz
        # configurado, e a segunda entrada quebra o apt com conflito de
        # chave. A imagem oficial resolve as duas coisas de uma vez:
        # versão exata, sem mexer no sistema da máquina.
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p saida

          pgdump() {
            docker run --rm -e PGCONN -v "$PWD:/trabalho" -w /trabalho \
              postgres:17-alpine pg_dump "$@"
          }

          docker run --rm postgres:17-alpine pg_dump --version

          # Completo, com dados, em formato próprio: é o que se restaura.
          # auth entra junto porque é lá que moram os usuários; sem ele, o
          # banco restaurado teria contas sem dono.
          pgdump "$PGCONN" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file=saida/floatvideo.dump

          # Só o desenho, em texto: este é o que fica no repositório.
          pgdump "$PGCONN" \
            --schema-only --no-owner --no-privileges \
            --schema=public \
            --file=db/schema.sql

          # As tarefas agendadas moram no esquema "cron", que é da
          # extensão e não sai no dump. As funções que elas chamam estão
          # salvas; o agendamento, não — e sem ele um banco restaurado
          # pararia de mandar os e-mails de cobrança sem acusar erro
          # nenhum. Aqui elas viram linhas de SQL no fim do schema.
          docker run --rm -e PGCONN -v "$PWD:/trabalho" -w /trabalho             postgres:17-alpine psql "$PGCONN" -t -A -o /trabalho/saida/cron.sql             -c "select format('select cron.schedule(%L, %L, %L);', jobname, schedule, command) from cron.job where active order by jobid;"

          {
            echo ""
            echo "-- Tarefas agendadas (esquema cron, fora do dump)."
            echo "-- Rode isto depois de restaurar, com a extensao pg_cron ativa."
            cat saida/cron.sql
          } >> db/schema.sql

          # O contêiner escreve como root; sem isto o passo do commit não
          # conseguiria mexer no arquivo.
          sudo chown "$(id -u):$(id -g)" saida/floatvideo.dump db/schema.sql
          ls -lh saida/floatvideo.dump db/schema.sql

      - name: Enviar para o R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # O mesmo tropeço que o lib/r2.ts do painel já documenta: o
          # cliente da AWS manda um checksum que o R2 recusa quando não
          # foi pedido. Sem estas duas, o envio falha sem explicar.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CONTA: ${{ secrets.R2_ACCOUNT_ID }}
          BALDE: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          DATA=$(date -u +%Y-%m-%d)
          aws s3 cp saida/floatvideo.dump \
            "s3://$BALDE/backups/$DATA-floatvideo.dump" \
            --endpoint-url "https://$CONTA.r2.cloudflarestorage.com"
          echo "guardado em backups/$DATA-floatvideo.dump"

      - name: Versionar o desenho do banco, se mudou
        run: |
          set -euo pipefail
          # git status, e nao git diff: o diff so compara o que ja esta
          # sob versionamento, entao na primeira vez — com o arquivo
          # recem-criado — ele responde "nada mudou" e o passo passa em
          # verde sem commitar nada. Foi o que aconteceu na execucao #2.
          if [ -z "$(git status --porcelain -- db/schema.sql)" ]; then
            echo "schema sem mudanca nesta semana"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.sql
          git commit -m "Desenho do banco em $(date -u +%Y-%m-%d) [skip ci]"
          git push
