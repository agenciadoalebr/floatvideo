# Backup do banco, fora do Supabase e fora da Vercel.
#
# O Supabase já faz backup próprio. Este aqui existe para outro medo, que
# nenhum backup do próprio fornecedor cobre: perder o acesso à conta.
# Por isso ele roda no GitHub e guarda no Cloudflare R2 — três lugares
# diferentes, três contas diferentes.
#
# São dois artefatos, com finalidades distintas:
#
#   1. db/schema.sql, versionado aqui no repositório. É o que reconstrói
#      as 38 funções, as 29 políticas de RLS e os gatilhos — a regra de
#      negócio do FloatVideo mora no banco, e até agora ela só existia
#      dentro do Supabase. Ficar no git significa poder ler a diferença
#      de uma semana para a outra e enxergar o que mudou no banco.
#
#   2. O despejo completo, com dados, no R2. É o que se restaura.
#
# Para restaurar num Postgres novo:
#   pg_restore --no-owner --no-privileges -d "postgresql://..." arquivo.dump

name: Backup do banco

on:
  schedule:
    # Segunda-feira, 06:00 UTC — 03:00 em Brasília, quando ninguém usa.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      # Só para commitar o db/schema.sql quando ele mudar.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o pg_dump 17
        # O Ubuntu do runner traz uma versão mais antiga, e pg_dump recusa
        # servidor mais novo que ele. O banco é PostgreSQL 17.6.
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Gerar o despejo
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p saida

          # Completo, com dados, em formato próprio: é o que se restaura.
          # auth entra junto porque é lá que moram os usuários; sem ele, o
          # banco restaurado teria contas sem dono.
          pg_dump "$PGCONN" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file=saida/floatvideo.dump

          # Só o desenho, em texto: este é o que fica no repositório.
          pg_dump "$PGCONN" \
            --schema-only --no-owner --no-privileges \
            --schema=public \
            --file=db/schema.sql

          ls -lh saida/floatvideo.dump db/schema.sql

      - name: Enviar para o R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # O mesmo tropeço que o lib/r2.ts do painel já documenta: o
          # cliente da AWS manda um checksum que o R2 recusa quando não
          # foi pedido. Sem estas duas, o envio falha sem explicar.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CONTA: ${{ secrets.R2_ACCOUNT_ID }}
          BALDE: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          DATA=$(date -u +%Y-%m-%d)
          aws s3 cp saida/floatvideo.dump \
            "s3://$BALDE/backups/$DATA-floatvideo.dump" \
            --endpoint-url "https://$CONTA.r2.cloudflarestorage.com"
          echo "guardado em backups/$DATA-floatvideo.dump"

      - name: Versionar o desenho do banco, se mudou
        run: |
          set -euo pipefail
          if git diff --quiet -- db/schema.sql; then
            echo "schema sem mudanca nesta semana"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.sql
          git commit -m "Desenho do banco em $(date -u +%Y-%m-%d) [skip ci]"
          git push
